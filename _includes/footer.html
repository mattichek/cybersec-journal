<footer class="site-footer">
  <div class="wrap">
    <p class="foot-line"><span class="prompt">$</span> echo "{{ site.author }} — {{ site.tagline }}"</p>
    <p class="foot-meta">
      &copy; {{ 'now' | date: "%Y" }} {{ site.author }}.
      Zbudowane z Jekyll &amp; GitHub Pages.
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a> ·
      <a href="{{ site.github_url }}" target="_blank" rel="noopener">github</a> ·
      <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">linkedin</a>
    </p>
  </div>
</footer>
